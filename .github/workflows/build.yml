# 푸시마다 도는 검증. 비밀값이 없어도 돌아간다.
#
# connectedAndroidTest(계측 테스트)는 일부러 넣지 않는다.
# 계측 테스트는 실행 전에 앱을 지우는데, 이 앱의 Room DB에는 시스템이 더 보관하지 않는
# 누적 사용 기록이 들어 있어 한 번 지우면 복구할 수 없다.
name: 빌드와 테스트

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 윈도에서 만든 저장소는 gradlew의 실행 권한이 빠져 있을 수 있다.
      - name: gradlew 실행 권한
        run: chmod +x ./gradlew

      # 러너에 없는 플랫폼은 AGP가 직접 받아오지만 라이선스 동의가 먼저 필요하다.
      # 패키지 이름이 바뀌어 설치가 실패해도 AGP의 자동 다운로드가 남아 있으므로 멈추지 않는다.
      - name: Android SDK 준비
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" || true

      - name: 단위 테스트
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: 실패한 경우 보고서 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 보고서
          path: |
            app/build/reports/
            app/build/test-results/

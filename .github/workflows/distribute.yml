# v로 시작하는 태그를 밀면 release APK를 만들어 GitHub Release에 붙인다.
#
# Google Cloud를 쓰지 않는다. 업로드에 쓰는 토큰은 GitHub가 실행마다 만들어 주는
# GITHUB_TOKEN이고, 따로 발급받거나 보관할 것이 없다.
#
# 서명 키는 기기에 이미 설치된 앱과 같아야 한다. 서명이 달라지면 adb install -r로
# 덮어쓸 수 없고 삭제 후 재설치만 가능해져, 그때 누적된 사용 기록이 사라진다.
# 그래서 Android 기본 debug 키스토어를 시크릿으로 넣어 쓴다.
name: 배포

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    # Release를 만들려면 저장소 쓰기 권한이 필요하다. 기본값은 읽기뿐이다.
    permissions:
      contents: write

    steps:
      # 직전 태그의 versionCode와 비교하려면 이력과 태그가 모두 필요하다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 윈도에서 만든 저장소는 gradlew의 실행 권한이 빠져 있을 수 있다.
      - name: gradlew 실행 권한
        run: chmod +x ./gradlew

      # 러너에 없는 플랫폼은 AGP가 직접 받아오지만 라이선스 동의가 먼저 필요하다.
      # 패키지 이름이 바뀌어 설치가 실패해도 AGP의 자동 다운로드가 남아 있으므로 멈추지 않는다.
      - name: Android SDK 준비
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" || true

      # 버전을 올리지 않고 태그만 만드는 실수를 막는다.
      # versionCode를 올리지 않으면 기기가 새 APK를 업데이트로 받아들이지 않는다.
      - name: 버전 읽고 태그와 맞는지 확인
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "태그가 가리키는 커밋: $(git log -1 --format='%h %s')"
          echo "그 커밋의 build.gradle.kts: versionName=$VERSION_NAME versionCode=$VERSION_CODE"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
              echo "::error::태그 v$TAG_VERSION 이 가리키는 커밋의 versionName 은 '$VERSION_NAME' 입니다."
              echo "::error::버전을 올렸지만 그 변경을 커밋하지 않고 태그를 만들었을 가능성이 가장 큽니다. 태그는 작업 트리가 아니라 커밋을 가리킵니다."
              echo "::error::로컬에서 다음으로 확인하세요: git show HEAD:app/build.gradle.kts | grep versionName"
              echo "::error::고치는 방법: git add app/build.gradle.kts && git commit && git push 뒤에 태그를 지우고 다시 만듭니다. doc/deploy.md 8단계 참고."
              exit 1
            fi

            # versionName만 올리고 versionCode를 그대로 두면, 기기가 새 APK를
            # 업데이트로 받아들이지 않는다. 설치는 되지만 아무 일도 일어나지 않아
            # 원인을 찾기 어렵다. 직전 태그와 비교해 여기서 막는다.
            PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
            if [ -n "$PREVIOUS_TAG" ]; then
              PREVIOUS_CODE=$(git show "$PREVIOUS_TAG:app/build.gradle.kts" | grep -oP 'versionCode = \K[0-9]+')
              echo "직전 태그 $PREVIOUS_TAG 의 versionCode: $PREVIOUS_CODE"
              if [ "$VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
                echo "::error::versionCode가 $PREVIOUS_CODE 에서 올라가지 않았습니다($VERSION_CODE). 올린 뒤 태그를 다시 만드세요."
                exit 1
              fi
            fi
          fi

      - name: 단위 테스트
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: 서명 키스토어 복원
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::시크릿 RELEASE_KEYSTORE_BASE64 가 비어 있습니다."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: release APK 빌드
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # 서명이 기기의 것과 같은지 확인한다. 다르면 설치할 때 기록이 사라지므로 여기서 멈춘다.
      # 지문은 비밀이 아니라 저장소 변수(Variables)에 둔다. 시크릿에 넣으면 로그가 ***로 가려져
      # 어긋났을 때 무엇과 달랐는지 읽을 수 없다.
      - name: 서명 지문 확인
        env:
          EXPECTED_SIGNER_SHA1: ${{ vars.EXPECTED_SIGNER_SHA1 }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -oiE 'SHA-1 digest: [0-9a-f]+' | head -1 | awk '{print tolower($3)}')
          echo "서명 지문: $ACTUAL"
          if [ -z "$EXPECTED_SIGNER_SHA1" ]; then
            echo "::warning::변수 EXPECTED_SIGNER_SHA1 이 없어 서명 검사를 건너뜁니다."
          elif [ "$ACTUAL" != "$EXPECTED_SIGNER_SHA1" ]; then
            echo "::error::서명이 기대값($EXPECTED_SIGNER_SHA1)과 다릅니다. 이 APK를 설치하면 누적 기록이 사라집니다."
            exit 1
          fi

      # 버전이 파일 이름에 들어가야, 내려받아 쌓아 둔 APK를 나중에 구별할 수 있다.
      - name: APK 이름에 버전 붙이기
        id: artifact
        run: |
          NAME="TracePhone-${{ steps.version.outputs.versionName }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Firebase에 손으로 넣을 JSON을 여기서 만들어 준다.
      # 손으로 적으면 versionCode를 잘못 쓰거나 주소에 오타가 나고, 그러면 앱이
      # "최신입니다"라고 거짓을 말하거나 내려받기를 신뢰할 수 없다고 거부한다.
      - name: Firebase에 넣을 버전 기록 만들기
        id: manifest
        run: |
          DOWNLOAD_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.artifact.outputs.name }}"
          cat > latest.json <<JSON
          {
            "versionCode": ${{ steps.version.outputs.versionCode }},
            "versionName": "${{ steps.version.outputs.versionName }}",
            "downloadUrl": "$DOWNLOAD_URL"
          }
          JSON
          {
            echo "## Firebase에 붙여 넣을 내용"
            echo
            echo 'Realtime Database의 `latest` 경로에 이 JSON을 넣으면 앱이 새 버전을 알립니다.'
            echo
            echo '```json'
            cat latest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat latest.json

      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## 설치"
            echo
            echo "아래 \`${{ steps.artifact.outputs.name }}\` 를 내려받아 설치합니다."
            echo "설치 뒤 **설정 → 애플리케이션 → 특별한 접근 권한 → 사용 정보 접근**에서 권한을 켜야 동작합니다."
            echo
            echo "## 버전 기록"
            echo
            echo "Firebase Realtime Database의 \`latest\` 경로에 넣을 내용입니다."
            echo
            echo '```json'
            cat latest.json
            echo '```'
          } > release-notes.md

          gh release create "${{ github.ref_name }}" \
            "${{ steps.artifact.outputs.name }}" \
            latest.json \
            --title "${{ steps.version.outputs.versionName }}" \
            --notes-file release-notes.md

      # 러너는 매번 새로 만들어지지만, 키 파일을 남겨두지 않는다.
      - name: 키 파일 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

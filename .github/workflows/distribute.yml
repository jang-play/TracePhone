# v로 시작하는 태그를 밀면 release APK를 만들어 Firebase App Distribution에 올린다.
#
# 서명 키는 기기에 이미 설치된 앱과 같아야 한다. 서명이 달라지면 adb install -r로
# 덮어쓸 수 없고 삭제 후 재설치만 가능해져, 그때 누적된 사용 기록이 사라진다.
# 그래서 Android 기본 debug 키스토어를 시크릿으로 넣어 쓴다.
name: Firebase 배포

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: gradlew 실행 권한
        run: chmod +x ./gradlew

      - name: Android SDK 준비
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" || true

      # 태그만 올리고 versionName을 안 올리는 실수를 막는다.
      # App Distribution에서 같은 버전이 여러 번 올라오면 어느 것이 최신인지 구별할 수 없다.
      - name: 태그와 versionName이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "태그: $TAG_VERSION / build.gradle.kts: $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::태그 v$TAG_VERSION 과 versionName $APP_VERSION 이 다릅니다. versionCode와 versionName을 올린 뒤 태그를 다시 만드세요."
            exit 1
          fi

      - name: 단위 테스트
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: 서명 키스토어 복원
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::시크릿 RELEASE_KEYSTORE_BASE64 가 비어 있습니다."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: release APK 빌드
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # 서명이 기기의 것과 같은지 확인한다. 다르면 설치할 때 기록이 사라지므로 여기서 멈춘다.
      - name: 서명 지문 확인
        env:
          EXPECTED_SIGNER_SHA1: ${{ secrets.EXPECTED_SIGNER_SHA1 }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -oiE 'SHA-1 digest: [0-9a-f]+' | head -1 | awk '{print tolower($3)}')
          echo "서명 지문: $ACTUAL"
          if [ -n "$EXPECTED_SIGNER_SHA1" ] && [ "$ACTUAL" != "$EXPECTED_SIGNER_SHA1" ]; then
            echo "::error::서명이 기기의 것과 다릅니다. 이 APK를 설치하면 누적 기록이 사라집니다."
            exit 1
          fi

      - name: Firebase 서비스 계정 키 복원
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: App Distribution 업로드
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          npm install -g firebase-tools@15.34.0
          firebase appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups testers \
            --release-notes "${{ github.ref_name }} · ${{ github.sha }}"

      # 러너는 매번 새로 만들어지지만, 키 파일을 남겨두지 않는다.
      - name: 키 파일 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/firebase-service-account.json"

      - name: APK 보관
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk

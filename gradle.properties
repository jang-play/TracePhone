org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# 새 버전 기록(JSON)을 읽을 주소. Firebase Realtime Database의 공개 읽기 경로를 넣는다.
# 비어 있으면 앱이 업데이트 확인 기능을 아예 내보이지 않는다.
# 예: https://tracephone-xxxx-default-rtdb.asia-southeast1.firebasedatabase.app/latest.json
tracephone.updateManifestUrl=https://tracephone-4ca52-default-rtdb.asia-southeast1.firebasedatabase.app/latest.json
